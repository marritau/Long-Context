[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "long-context-pearl"
version = "0.1.0"
description = "PEARL: position-aware evidence assembly for reliable long-context QA."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "HSE Long-Context Research" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
retrieval = [
  "rank-bm25>=0.2.2",
  "sentence-transformers>=2.7",
  "faiss-cpu>=1.8",
  "FlagEmbedding>=1.2",
]
generation = [
  "torch",
  "transformers",
  "accelerate",
  "vllm",
]
metrics = [
  "evaluate",
  "rouge-score",
  "sacrebleu",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
