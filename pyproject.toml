[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-interaction-kv"
version = "0.19.0"
description = "Interaction-aware KV-cache compression for long-context evidence chains"
requires-python = ">=3.10"
dependencies = [
  "kvpress==0.5.5",
  "numpy>=1.26,<2; python_version < '3.13'",
  "numpy>=2.1,<3; python_version >= '3.13'",
  "torch>=2.3.1,<3",
  "transformers==4.57.6",
  "accelerate>=1,<2",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "tqdm>=4.66,<5",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
bikv = "bikv.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
