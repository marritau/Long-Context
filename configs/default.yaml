seed: 42

chunking:
  chunk_size: 768
  chunk_overlap: 128
  structure_aware: true

retrieval:
  top_m: 80
  top_k: 12
  bm25_weight: 0.20
  dense_weight: 0.35
  cross_encoder_weight: 0.35
  structure_weight: 0.10
  rrf_k: 60
  dense_dim: 384

graph:
  enabled: true
  semantic_weight: 0.60
  adjacency_weight: 0.25
  section_weight: 0.15
  pagerank_alpha: 0.85
  pagerank_iters: 50

selection:
  redundancy_penalty: 0.25
  relevance_weight: 0.55
  graph_weight: 0.45
  pre_compression_budget: 24000

compression:
  enabled: true
  final_budget: 8192
  min_chunk_budget: 128
  sentence_neighbor_keep: true
  compression_temperature: 1.0

ordering:
  enabled: true
  mode: pearl
  rho: 0.35
  kappa: 2.0
  preserve_local_neighbors: true

generation:
  temperature: 0.0
  max_new_tokens: 256
  stop: null

evaluation:
  evidence_overlap_threshold: 0.3
  normalize_answers: true
